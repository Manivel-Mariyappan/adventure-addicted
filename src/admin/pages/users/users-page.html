<admin-ui-only-note api="/api/users" />
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white d-flex flex-wrap align-items-center gap-3 py-3">
    <input
      type="search"
      class="form-control form-control-sm"
      style="max-width: 300px"
      placeholder="Search by name, email or phone"
      aria-label="Search users"
      (input)="search.set($any($event.target).value)"
    />
    <div class="form-check form-switch mb-0">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="usr-show-all"
        [checked]="showAll()"
        (change)="showAll.set(!showAll())"
      />
      <label class="form-check-label small" for="usr-show-all">Show all, including inactive</label>
    </div>
    <button type="button" class="btn btn-sm btn-primary ms-auto" (click)="open(null)">
      + Add user
    </button>
  </div>
  <ag-grid-angular
    style="display: block; height: calc(100vh - 260px); min-height: 360px"
    [theme]="theme"
    [rowData]="rows()"
    [columnDefs]="columns"
    [defaultColDef]="{
      sortable: true,
      filter: true,
      resizable: true,
      suppressHeaderMenuButton: true,
    }"
    [getRowId]="getRowId"
    [rowClassRules]="{ 'row-deleted': isInactive }"
    [rowHeight]="52"
  />
</div>
