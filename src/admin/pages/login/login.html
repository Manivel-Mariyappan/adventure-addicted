<div
  class="min-vh-100 d-flex align-items-center justify-content-center p-3 page"
  style="background-image: url('art/hero.svg')"
>
  <form class="card shadow border-0 login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <!-- night sky over the passes, with prayer flags strung across -->
    <div class="band">
      <svg viewBox="0 0 440 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path d="M0 150V112l60-38 44 26 70-56 58 44 46-30 72 52 50-26 40 22v44Z" fill="#24396a" />
        <path d="M0 150v-20l90-34 70 30 80-40 90 42 110-30v52Z" fill="#1a2b52" />
      </svg>
      <app-prayer-flags class="flags" />
      <div class="brand">
        <img [src]="logo()" alt="" style="object-fit: contain" width="34" height="34" />
        <span>Adventure Addicted</span>
      </div>
    </div>
    <div class="card-body p-4 px-md-5 pt-4">
      <h1 class="h3 fw-bold mb-1">Admin portal</h1>
      <p class="text-body-secondary mb-4">
        Sign in to manage tours, departures, bookings and payments.
      </p>

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
      }

      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input
          id="username"
          placeholder="Enter your username"
          class="form-control form-control-lg"
          formControlName="username"
          autocomplete="username"
          autofocus
          [class.is-invalid]="submitted() && form.controls.username.invalid"
        />
        <div class="invalid-feedback">Username is required.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group input-group-lg has-validation">
          <input
            id="password"
            placeholder="Enter your password"
            class="form-control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="submitted() && form.controls.password.invalid"
          />
          <button
            type="button"
            class="btn btn-outline-secondary d-flex align-items-center"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [title]="showPassword() ? 'Hide password' : 'Show password'"
          >
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="20" />
          </button>
          <div class="invalid-feedback">Password is required.</div>
        </div>
      </div>
      <button
        class="btn btn-primary btn-lg w-100 fs-6 fw-semibold"
        type="submit"
        [disabled]="busy()"
      >
        @if (busy()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Sign in
      </button>
      <a routerLink="/" class="d-block text-center mt-3 small">← Back to website</a>
    </div>
  </form>
</div>
